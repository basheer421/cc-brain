[project]
name = "cc-brain"
version = "0.1.0"
description = "Claude Code session meta-summarizer with macOS menu bar"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "watchdog>=4.0.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[project.scripts]
cc-brain = "cc_brain.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
