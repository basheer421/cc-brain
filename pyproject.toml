[project]
name = "cc-brain"
version = "2.0.0"
description = "Knowledge consolidator and MCP server for AI coding agents"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0.0",
    "requests>=2.31.0",
    "click>=8.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
cc-brain = "cc_brain.cli:main"

[tool.setuptools.packages.find]
include = ["cc_brain*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
